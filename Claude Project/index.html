<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal &amp; Todo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="brand">Notebook</h1>
    <nav class="nav" aria-label="Sections">
      <a href="#journal" class="nav-link" data-view="journal">Journal</a>
      <a href="#todo" class="nav-link" data-view="todo">Todo</a>
    </nav>
  </header>

  <p id="storage-warning" class="notice" hidden>
    Browser storage is unavailable (private window or blocked site data). Anything you add will be lost when you close this tab.
  </p>

  <main>
    <section id="view-journal" class="view" data-view="journal" hidden>
      <h2>Journal</h2>
      <form id="journal-form" class="card form">
        <input id="journal-title" type="text" placeholder="Title" maxlength="120">
        <textarea id="journal-body" rows="5" placeholder="What's on your mind?" required></textarea>
        <button type="submit">Save entry</button>
      </form>
      <ul id="journal-list" class="list"></ul>
      <p id="journal-empty" class="empty" hidden>No journal entries yet. Write your first one above.</p>
    </section>

    <section id="view-todo" class="view" data-view="todo" hidden>
      <h2>Todo</h2>
      <form id="todo-form" class="card form form-inline">
        <input id="todo-text" type="text" placeholder="Add a task" maxlength="200" required>
        <button type="submit">Add</button>
      </form>
      <p id="todo-count" class="meta"></p>
      <ul id="todo-list" class="list"></ul>
      <p id="todo-empty" class="empty" hidden></p>
    </section>
  </main>

  <!-- Classic scripts, not ES modules: modules are blocked on file://, and this app opens by double-click. -->
  <script src="js/storage.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/todo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
